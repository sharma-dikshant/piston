services:
    api:
        image: ghcr.io/sharma-dikshant/piston:latest
        build: ./api
        container_name: piston_api
        restart: always
        privileged: true
        ports:
            - ${PISTON_HOST_BIND:-127.0.0.1}:2000:2000
        volumes:
            - ./data/piston/packages:/piston/packages
        tmpfs:
            - /tmp:exec
        environment:
            - PISTON_API_KEY=${PISTON_API_KEY:?PISTON_API_KEY must be set}
            - PISTON_MAX_CONCURRENT_JOBS=${PISTON_MAX_CONCURRENT_JOBS:-4}
            - PISTON_LOG_LEVEL=${PISTON_LOG_LEVEL:-INFO}
            - PISTON_REPO_URL=${PISTON_REPO_URL:-https://github.com/sharma-dikshant/piston/releases/download/pkgs/index}
        mem_limit: ${PISTON_MEM_LIMIT:-3g}
        cpus: ${PISTON_CPUS:-2}
